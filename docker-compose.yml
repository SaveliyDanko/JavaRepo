# RabbitMQ с management UI. Поднять: docker compose up -d
# UI: http://localhost:15672 (логин/пароль guest/guest)
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: javarepo-rabbitmq
    ports:
      - "5672:5672"    # AMQP-порт для приложения
      - "15672:15672"  # management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
